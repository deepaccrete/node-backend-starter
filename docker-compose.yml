# Local full stack: MongoDB + the API. MongoDB is published on host port 27017.
# From the host, connect with MONGODB_URI=mongodb://localhost:27017/tpjp
#
#   docker compose up -d db                                   # database only
#   docker compose up -d api
services:
  db:
    image: mongo:8
    ports:
      - '27017:27017'
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping").ok']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    env_file: .env
    environment:
      # The container runs as production (stdout logs, strict CORS) whatever .env says.
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      # Inside the compose network the database is reached by its service name.
      MONGODB_URI: mongodb://db:27017/tpjp
    ports:
      - '${PORT:-8001}:${PORT:-8001}'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Uploaded files survive container rebuilds. Logs go to stdout (docker compose logs api).
      - ./uploads:/app/dist/src/public/uploads

volumes:
  mongodata:
